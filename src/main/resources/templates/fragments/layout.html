<!-- ══ FRAGMENT: connect-modal ════════════════════════════════════════ -->
<div th:fragment="connect-modal" id="connect-modal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title">Connect to PostgreSQL</span>
            <button type="button" class="btn btn-ghost btn-sm btn-icon" onclick="Nova.closeModal('connect-modal')"
                    style="font-size:16px;line-height:1">&#x2715;
            </button>
        </div>
        <form id="connect-form">
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Host</label>
                        <input class="form-input" type="text" name="host" placeholder="localhost" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Port</label>
                        <input class="form-input" type="number" name="port" value="5432" required/>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Database</label>
                    <input class="form-input" type="text" name="database" placeholder="postgres" required/>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input class="form-input" type="text" name="username" placeholder="postgres" required/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input class="form-input" type="password" name="password"
                               placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"/>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-ghost" onclick="Nova.closeModal('connect-modal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Connect</button>
            </div>
        </form>
    </div>
</div>

</html>
